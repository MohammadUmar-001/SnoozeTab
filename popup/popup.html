<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>SnoozeTabs</title>
  <link rel="stylesheet" href="popup.css" />
</head>
<body>
  <div id="app">
    <header class="tf-header">
      <div class="tf-brand">
        <img src="../icons/icon48.png" width="20" height="20" alt="" class="tf-brand-mark" />
        <span class="tf-brand-name">SnoozeTabs</span>
      </div>
      
      <div class="tf-header-actions">
        <span class="tf-stat" id="statLine">0 frozen</span>
        <label class="tf-switch" title="Pause or resume auto-freezing">
          <input type="checkbox" id="enabledToggle" />
          <span class="tf-switch-track"><span class="tf-switch-thumb"></span></span>
        </label>
        <button class="tf-icon-btn" id="openOptions" title="Settings">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
        </button>
      </div>
    </header>
  
    <main>
      <ul class="tf-tab-list" id="tabList" aria-label="Open tabs"></ul>
    </main>
  </div>

  <template id="tabRowTemplate">
    <li class="tf-row">
      <div class="tf-favicon-wrapper">
        <img class="tf-favicon" alt="" />
        <span class="tf-status-dot"></span>
      </div>
      <div class="tf-row-main">
        <p class="tf-row-title"></p>
        <p class="tf-row-meta"></p>
      </div>
      <div class="tf-row-actions">
        
        <div class="tf-dropdown">
          <button class="tf-dropdown-trigger" title="Set tab freeze mode">
            <span class="tf-dropdown-label">Auto</span>
            <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6"/></svg>
          </button>
          <div class="tf-dropdown-menu">
            <button class="tf-dropdown-item" data-value="auto">Auto</button>
            <button class="tf-dropdown-item" data-value="discard">Discard</button>
            <button class="tf-dropdown-item" data-value="soft">Soft</button>
            <button class="tf-dropdown-item" data-value="never">Never</button>
          </div>
        </div>

        <button class="tf-action-btn" title="Toggle state">
          <svg class="icon-freeze" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path></svg>
          <svg class="icon-wake" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M5 3l14 9-14 9V3z"/></svg>
        </button>
      </div>
    </li>
  </template>

  <script src="../lib/browser-compat.js"></script>
  <script src="popup.js"></script>
</body>
</html>
