name: CI

on:
  push:
    branches: ['**']
  pull_request:
    branches: [main]

jobs:
  lint-and-test:
    name: Lint & test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Validate manifest.json is well-formed
        run: node -e "JSON.parse(require('fs').readFileSync('manifest.json', 'utf8')); console.log('manifest.json OK')"

      - name: Lint
        run: npm run lint

      - name: Unit tests (rules engine)
        run: npm test

  package:
    name: Package extension
    needs: lint-and-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build zip
        run: npm run package

      - name: Firefox add-on validation (informational only)
        continue-on-error: true
        run: npx --yes web-ext lint --source-dir dist/SnoozeTab --self-hosted

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: SnoozeTab-extension
          path: dist/SnoozeTab.zip
          if-no-files-found: error
